name: Build SuperMini Firmware

on:
  push:
    branches:
      - supermini-v4.0.8
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          pip install wheel
          pip install platformio

      - name: Build ESP32-C3 SuperMini
        run: pio run -e esp32c3-cdc

      - name: Upload firmware
        uses: actions/upload-artifact@v6
        with:
          name: ESPresense-SuperMini
          path: |
            .pio/build/esp32c3-cdc/firmware.bin
            .pio/build/esp32c3-cdc/bootloader.bin
            .pio/build/esp32c3-cdc/partitions.bin
